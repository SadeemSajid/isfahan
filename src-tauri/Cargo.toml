[package]
name = "isfahan"
version = "0.1.0"
description = "A lightweight, privacy-first desktop writing companion that rewards your productivity."
authors = ["Sadeem"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "isfahan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"
